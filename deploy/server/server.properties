# Seeded once into /data by the entrypoint; edit the copy in the volume, not this file.
# The studio builder assumes a superflat world with the grass top at y=64 (docs/multiplayer/audit.md A-32).
# Level name "AgentCraft HQ" turns on the mod's HQ world rules and builds the studio on first start.
level-name=AgentCraft HQ
level-type=minecraft\:flat
generator-settings={"layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:stone","height"\:124},{"block"\:"minecraft\:dirt","height"\:3},{"block"\:"minecraft\:grass_block","height"\:1}],"biome"\:"minecraft\:plains","lakes"\:false,"features"\:false}
generate-structures=false
gamemode=creative
difficulty=peaceful
spawn-monsters=false
pvp=false
online-mode=true
white-list=true
enforce-whitelist=true
spawn-protection=0
max-players=20
view-distance=12
simulation-distance=8
motd=AgentCraft studio server
server-port=25565
# The management JSON-RPC server stays off (it is the only TLS listener; see deploy/.trivyignore).
management-server-enabled=false
