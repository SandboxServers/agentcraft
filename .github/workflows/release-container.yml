name: release-container

# Build and publish the AgentCraft dedicated-server container (Fabric 26.3 + Fabric API + the mod).
# Modelled on Cimmeria's release pipeline. Releases are gated: this workflow does NOT run on push.
# Trigger paths:
#
#   1. Comment `/release` on a merged PR. release-on-comment.yml validates the commenter and
#      dispatches this workflow.
#   2. Run it from the Actions UI ("Run workflow"), or `gh workflow run release-container.yml --ref main`.
#
# Either way it builds `main` HEAD. `triggering_pr` is audit metadata only.
#
# Published to:
#   1. ghcr.io/<owner>/agentcraft-server:<YYYY-MM-DD.N>   (immutable, with provenance + SBOM)
#   2. ghcr.io/<owner>/agentcraft-server:latest-prerelease (rolling; moved only after the smoke test)
#   3. a GitHub pre-release with the deploy notes
#
# Deployment: the colo runs deploy/compose.yaml, whose Watchtower polls `latest-prerelease` and
# swaps the container (after a world backup). No host address, SSH key or credential is stored
# in this repository or its secrets: the colo pulls, nothing pushes to it.

on:
  workflow_dispatch:
    inputs:
      triggering_pr:
        description: 'Optional PR number that prompted this release (audit only)'
        required: false
        type: string

permissions: {}

# Serialise releases; never cancel one that started (a half-published release is worse).
concurrency:
  group: release-container
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: build, scan, push, smoke, release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # gh release create
      packages: write       # push to ghcr.io
      attestations: write   # provenance + SBOM attestations
      id-token: write       # OIDC for keyless provenance signing
    # Cold: Gradle downloads Minecraft and Fabric (~600 MB) and the launcher pre-downloads the
    # server. 45 minutes leaves room for one registry retry.
    timeout-minutes: 45
    steps:
      # workflow_dispatch accepts any --ref; releases come from main only.
      - name: reject non-main dispatches
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::release-container must be dispatched from main; got ${REF}"
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/agentcraft-server" >> "$GITHUB_OUTPUT"

      - name: compute version (YYYY-MM-DD.N)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
                --jq "[.[] | select(.tagName | startswith(\"v${DATE}.\"))] | length")
          N=$((N + 1))
          # A run that pushed the image but failed before `gh release create` leaves a tag the
          # release list misses; the registry is the source of truth.
          while docker manifest inspect "${IMAGE}:${DATE}.${N}" >/dev/null 2>&1; do
            N=$((N + 1))
          done
          echo "version=${DATE}.${N}" >> "$GITHUB_OUTPUT"
          echo "tag=v${DATE}.${N}"    >> "$GITHUB_OUTPUT"
          echo "created=${CREATED}"   >> "$GITHUB_OUTPUT"

      # Two passes: load for the scan (no attestations possible with `load`), then push with
      # attestations from the cache. A CRITICAL finding blocks publishing entirely.
      - name: build (load locally for scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
          build-args: |
            AGENTCRAFT_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: deploy/.trivyignore

      # What Watchtower does on the colo, end to end: boot, back up, stop gracefully, start the
      # image again on the same volume, and check the world survived. A third boot mounts an
      # enabled copy of the server config, so the multiplayer config path is smoke-tested without
      # shipping it live: the shipped config keeps multiplayer off (deploy/server/config/).
      - name: smoke-test the image (boot, studio build, backup, graceful stop, persistence)
        env:
          IMAGE: ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
        run: |
          set -uo pipefail
          RCON="rcon-cli --host 127.0.0.1 --port 25575 --password smoke-only"
          # The same ten keys as the shipped seed, with multiplayer on. Mounted only for the last boot.
          ENABLED_CFG=/tmp/agentcraft-enabled.json
          cat > "$ENABLED_CFG" <<'JSON'
          { "enabled": true, "plotStride": 128, "autoAllocate": true, "autoBuild": true,
            "forceCreative": true, "worldRules": true, "protectPlots": true,
            "relayRadiusChunks": 12, "publicStatePerSecond": 4, "intentsPerSecond": 10 }
          JSON
          up() {
            docker run -d --name smoke -v smoke-data:/data "$@" \
              -e EULA=TRUE -e MEMORY=2G -e RCON_PASSWORD=smoke-only "$IMAGE" >/dev/null
            for i in $(seq 1 90); do
              if logs_have 'Done (' \
                 && docker exec smoke bash -c 'exec 3<>/dev/tcp/127.0.0.1/25565' 2>/dev/null \
                 && docker exec smoke $RCON list >/dev/null 2>&1; then
                echo "ready after $((i * 2)) s"; return 0
              fi
              if [ "$(docker inspect -f '{{.State.Status}}' smoke 2>/dev/null)" = "exited" ]; then
                echo "::error::container exited before becoming ready"; return 1
              fi
              sleep 2
            done
            echo "::error::server not ready within 180 s"; return 1
          }
          dump() { echo "::group::container logs ($1)"; docker logs smoke 2>&1 || true; echo "::endgroup::"; }
          # Never pipe into `grep -q` under pipefail: grep exits at the first match, the writer gets
          # SIGPIPE and the pipeline "fails" although the text is there (a flaky false negative).
          logs_have() { docker logs smoke > /tmp/smoke.log 2>&1; grep -q -- "$1" /tmp/smoke.log; }
          logs_lack() { docker logs smoke > /tmp/smoke.log 2>&1; ! grep -q -- "$1" /tmp/smoke.log; }
          rcon_says() { docker exec smoke $RCON "$1" > /tmp/rcon.out 2>&1; grep -q -- "$2" /tmp/rcon.out; }
          down() {
            dump "$1"
            if docker inspect smoke >/dev/null 2>&1; then
              docker stop -t 120 smoke >/dev/null || ok=0
              docker rm smoke >/dev/null || true
            fi
          }

          # The image must ship the seed with multiplayer off, whatever a later release decides.
          docker run --rm --entrypoint cat "$IMAGE" \
            /opt/agentcraft/defaults/config/agentcraft-server.json > /tmp/shipped.json 2>/dev/null
          grep -Eq '"enabled"[[:space:]]*:[[:space:]]*false' /tmp/shipped.json \
            || { echo "::error::the shipped config is not enabled=false"; exit 1; }

          ok=1
          # Boot 1: the shipped config (multiplayer off) seeds and builds the studio.
          up || ok=0
          if [ "$ok" = 1 ]; then
            logs_have 'Seeded config/agentcraft-server.json.' \
              || { echo "::error::the entrypoint did not seed the server config"; ok=0; }
            logs_have 'event=config_loaded enabled=false file=config/agentcraft-server.json' \
              || { echo "::error::the shipped config did not load with enabled=false"; ok=0; }
            logs_lack 'event=config_invalid' \
              || { echo "::error::the shipped config has an invalid key"; ok=0; }
            logs_have 'AgentCraft common init done' || { echo "::error::mod did not initialise"; ok=0; }
            logs_have "Published layout 'studio'" || { echo "::error::studio was not built"; ok=0; }
            docker exec smoke $RCON "forceload add 0 0" >/dev/null
            sleep 2
            rcon_says "setblock 5 70 5 minecraft:gold_block" 'Changed the block' || { echo "::error::setblock failed"; ok=0; }
            docker exec smoke /opt/agentcraft/bin/backup.sh || { echo "::error::backup hook failed"; ok=0; }
          fi
          down "first start"
          # Boot 2: the same volume and shipped config, as Watchtower restarts it. The studio and the
          # placed block must survive.
          if [ "$ok" = 1 ]; then
            up || ok=0
            rcon_says "execute if block 5 70 5 minecraft:gold_block" 'Test passed' \
              || { echo "::error::world change did not survive a graceful stop"; ok=0; }
            logs_have 'Loaded layout' || { echo "::error::layout not reloaded"; ok=0; }
          fi
          down "after restart"
          # Boot 3: mount an enabled config to exercise the multiplayer load path. The smoke has no
          # client, so this proves config_loaded, not the hello (MP-14 Decision).
          if [ "$ok" = 1 ]; then
            up -v "$ENABLED_CFG:/data/config/agentcraft-server.json:ro" || ok=0
            logs_have 'event=config_loaded enabled=true file=config/agentcraft-server.json' \
              || { echo "::error::the enabled config did not load"; ok=0; }
            # MP-01 applies the world rules by config on an enabled server.
            logs_have 'event=world_rules_applied' \
              || { echo "::error::the world rules were not applied"; ok=0; }
            # Once MP-03 is in the jar, /help lists the plot sub-commands; RCON runs as owner.
            rcon_says "help agentcraft" 'plot' \
              || { echo "::error::plot commands are not registered"; ok=0; }
          fi
          down "enabled config"
          docker rm -f smoke >/dev/null 2>&1 || true
          docker volume rm smoke-data >/dev/null 2>&1 || true
          [ "$ok" = 1 ] || { echo "::error::smoke test failed"; exit 1; }

      - name: push dated tag (with provenance + SBOM)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
          build-args: |
            AGENTCRAFT_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.created=${{ steps.ver.outputs.created }}
          cache-from: type=gha
          provenance: true
          sbom: true

      # Only now move the rolling pointer the colo's Watchtower follows.
      - name: promote latest-prerelease
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:latest-prerelease" "${IMAGE}:${VERSION}"

      - name: create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRIGGERING_PR: ${{ inputs.triggering_pr }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -euo pipefail
          bash deploy/release-notes.sh "$VERSION" > /tmp/release-notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "AgentCraft server ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --target "$GITHUB_SHA"
          # Players install exactly the mod jar the server runs: copy it out of the released image.
          cid=$(docker create "${IMAGE}:${VERSION}")
          docker cp "${cid}:/opt/agentcraft/mods/agentcraft.jar" "/tmp/agentcraft-${VERSION}.jar"
          docker rm "$cid" >/dev/null
          gh release upload "$TAG" deploy/compose.yaml deploy/.env.example "/tmp/agentcraft-${VERSION}.jar" \
            --repo "$GITHUB_REPOSITORY" --clobber
